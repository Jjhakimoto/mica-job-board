name: Fetch jobs

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Fetch jobs
        run: npx tsx scripts/fetch-jobs.ts

      - name: Commit jobs.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/fetch-log.json
          if git diff --staged --quiet; then
            echo "No job data changes"
          else
            git commit -m "chore: update jobs.json from daily fetch"
            git push
          fi
